<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" xmlns:tk="http://typo3.org/ns/WizTech/ToolkitCore/Components" data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:wiz_monitor/Resources/Private/Language/locallang_be.xlf:" />
<f:switch expression="{status}">
    <f:case value="ok"><tk:pill label="{f:translate(key: '{ll}status.ok')}" state="ok" /></f:case>
    <f:case value="warning"><tk:pill label="{f:translate(key: '{ll}status.warning')}" state="warning" /></f:case>
    <f:case value="critical"><tk:pill label="{f:translate(key: '{ll}status.critical')}" state="critical" /></f:case>
    <f:defaultCase><tk:pill label="{f:translate(key: '{ll}status.unknown')}" state="neutral" /></f:defaultCase>
</f:switch>
</html>
