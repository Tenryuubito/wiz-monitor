<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <f:variable name="ll" value="LLL:EXT:wiz_monitor/Resources/Private/Language/locallang_be.xlf:" />
    <h1><f:translate key="{ll}module.secret.title" /></h1>
    <f:be.infobox title="{project.title}" state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
        <p><f:translate key="{ll}module.secret.instructions" /></p>
        <pre class="mb-0"><code>{environmentLine}</code></pre>
    </f:be.infobox>
    <p class="text-body-secondary"><f:translate key="{ll}module.secret.onceOnly" /></p>
</f:section>
</html>
