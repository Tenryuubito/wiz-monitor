<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" xmlns:tk="http://typo3.org/ns/WizTech/ToolkitCore/Components" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
<f:variable name="ll" value="LLL:EXT:wiz_monitor/Resources/Private/Language/locallang_be.xlf:" />
<div class="tk">
    <tk:header title="{f:translate(key: '{ll}module.secret.title')}" subtitle="{project.title}" />
    <tk:card>
        <p><f:translate key="{ll}module.secret.instructions" /></p>
        <pre class="tk-mono" style="margin: 0; padding: 12px 14px; border-radius: 6px; background: var(--tk-surface-2); overflow-x: auto;"><code>{environmentLine}</code></pre>
        <div class="tk-notice tk-notice--warning"><span><f:translate key="{ll}module.secret.onceOnly" /></span></div>
    </tk:card>
</div>
</f:section>
</html>
